name: verify

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      # The verify log contains node --test output until verify writes a separate report.
      - name: Verify
        shell: bash
        run: |
          # GitHub Actions invokes bash with -e. Lift it only long enough to print the log.
          # The step still exits with the node status. It does not exit 0 after a failure.
          set +e
          node scripts/verify.mjs > verify.log 2>&1
          status=$?
          set -e
          cat verify.log
          exit "$status"

      - name: Upload verify log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-log-${{ matrix.os }}
          path: verify.log
          retention-days: 30
          if-no-files-found: warn
