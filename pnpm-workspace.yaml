packages:
  - "apps/*"
  - "packages/*"

# Isolated linker is what makes a forbidden import fail at resolve time.
nodeLinker: isolated

# pnpm 12 defaults recorded by the security review. Do not set these to zero.
minimumReleaseAge: 1440
blockExoticSubdeps: true

# .node-version and engines.node are exact. Refuse a different Node at install.
engineStrict: true

# Default is true. Record it so a later default change cannot skip unreviewed scripts.
strictDepBuilds: true

# esbuild is the only approved script. Vite 7.3.6 does not install while
# esbuild@0.28.2's postinstall is ignored. That install.js was read: it uses
# the optional platform package pnpm already installed and checks the binary
# version. Its download fallback runs only when that package is missing, and
# it checks the hash published in esbuild's own package.json.
# pnpm's own wrapper script (install.js) was read and is not approved: Corepack
# supplies the pinned binary, and this project does not install the pnpm package.
allowBuilds:
  esbuild: true
